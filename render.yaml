services:
  - type: web
    name: narrativeos-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard — never hardcode
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EXTRACTOR
        value: gemini
      - key: PYTHON_VERSION
        value: "3.12"
